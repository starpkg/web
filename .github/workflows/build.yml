name: Build

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]


permissions: read-all

jobs:
  compatibility:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
      - name: Verify the pinned interpreter
        run: test "$(go list -m -f '{{.Version}}' go.starlark.net)" = "v0.0.0-20260324133313-ffb3f39dd27a"
      - name: Guard the compatible crypto dependency boundary
        # v0.55.0 keeps Go 1.25 support. Its SSH/OpenPGP packages must not enter
        # this application's build or tests; their advisories need a separate
        # dependency and compatibility review before either package is used.
        run: |
          go list -deps -test ./... > "$RUNNER_TEMP/crypto-imports.txt"
          if grep -E '^golang.org/x/crypto/(ssh|openpgp)(/|$)' "$RUNNER_TEMP/crypto-imports.txt"; then
            echo "Review the crypto version before adding SSH or OpenPGP dependencies"
            exit 1
          fi

  ci:
    permissions:
      contents: read
      id-token: write
    # Reusable CI lives in 1set/meta — the single source of truth for every
    # Star* module's pipeline. Pinned to a commit SHA for supply-chain safety;
    # bump the pin when meta's workflow changes (Dependabot github-actions can
    # automate this).
    uses: 1set/meta/.github/workflows/go-ci.yml@23f088bcd6dce16c93e0056d7b70b4f4434208e8
    with:
      go-floor: "1.25"
      doc-coverage: true
      doc-coverage-file: docs/API.md
      doc-coverage-config: true
      cov-min: 81
      footprint: true
      footprint-max-mb: 8
    secrets: inherit
